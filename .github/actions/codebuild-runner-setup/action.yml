name: CodeBuild runner setup
description: >
  Gives CodeBuild-hosted runners the tools and settings our workflows expect from GitHub-hosted images.
  Only changes what is missing, so it is a no-op on GitHub-hosted runners.
runs:
  using: composite
  steps:
    - name: Install missing Linux CLIs
      if: runner.os == 'Linux'
      shell: bash
      env:
        YQ_VERSION: v4.54.1
        YQ_SHA256_AMD64: 8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f
        YQ_SHA256_ARM64: 189088da0c6429ec5178dfaab1a114805f6cab0b61b165ab236efedf1d57a71b
      run: |
        set -euo pipefail
        packages=()
        # GitHub's Ubuntu image ships GNU awk as `awk` (needed for `awk -i inplace`); CodeBuild's ships mawk.
        # Installing gawk makes it the `awk` alternative.
        awk --version 2>/dev/null | grep -q "GNU Awk" || packages+=(gawk)
        # raven-actions/actionlint installs its helpers with pipx.
        command -v pipx >/dev/null || packages+=(pipx)
        if (( ${#packages[@]} )); then
          if command -v apt-get >/dev/null; then
            sudo apt-get install -y -qq "${packages[@]}" >/dev/null \
              || { sudo apt-get update -qq && sudo apt-get install -y -qq "${packages[@]}" >/dev/null; }
          else
            sudo dnf install -y -q "${packages[@]}"
          fi
        fi
        if ! yq --version 2>/dev/null | grep -q mikefarah; then
          arch=$(dpkg --print-architecture 2>/dev/null || uname -m | sed 's/x86_64/amd64/; s/aarch64/arm64/')
          case "$arch" in
            amd64) sha256=$YQ_SHA256_AMD64 ;;
            arm64) sha256=$YQ_SHA256_ARM64 ;;
            *) echo "No pinned yq checksum for $arch" >&2; exit 1 ;;
          esac
          curl -fsSL --retry 3 --retry-delay 5 --max-time 120 -o "$RUNNER_TEMP/yq" "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_${arch}"
          echo "$sha256  $RUNNER_TEMP/yq" | sha256sum -c --quiet
          sudo install -m 0755 "$RUNNER_TEMP/yq" /usr/local/bin/yq
        fi

    # CodeBuild runs the job in a container (/.dockerenv exists) next to the Docker daemon, not on it.
    # Mapped ports are not reachable on localhost from the job container, only via its default gateway
    # (the Docker host). Point Testcontainers there (TC_HOST for Python, TESTCONTAINERS_HOST_OVERRIDE for
    # Node) and drop the in-container marker, which otherwise sends Testcontainers to the "bridge" network.
    - name: Point Testcontainers at the Docker host
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if [ -f /.dockerenv ]; then
          gateway=$(ip route 2>/dev/null | awk '/^default/ {print $3; exit}')
          if [ -n "$gateway" ]; then
            echo "TC_HOST=$gateway" >> "$GITHUB_ENV"
            echo "TESTCONTAINERS_HOST_OVERRIDE=$gateway" >> "$GITHUB_ENV"
            # The machine is discarded after the job, so Ryuk cleanup is unneeded; its image comes from Docker Hub.
            echo "TESTCONTAINERS_RYUK_DISABLED=true" >> "$GITHUB_ENV"
            sudo rm -f /.dockerenv
          fi
        fi
