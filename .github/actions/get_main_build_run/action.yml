name: Get successful main build run
description: Find the latest successful run of a workflow on a branch.

inputs:
  github-token:
    required: true
    description: GitHub token used to query workflow runs.
  branch:
    required: true
    description: Branch whose latest workflow run should be used.
  head-sha:
    required: false
    default: ''
    description: >-
      If set, only a run built from this exact commit is accepted. This pins the release to the
      main build of the commit being released, rather than "latest successful on the branch".
  workflow-file:
    required: false
    default: main-build.yml
    description: File name of the workflow to query. A file path is unambiguous, unlike the display name.

outputs:
  run_id:
    description: ID of the latest successful workflow run.
    value: ${{ steps.main_build.outputs.run_id }}

runs:
  using: composite
  steps:
    - name: Get successful main build run
      id: main_build
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        TARGET_BRANCH: ${{ inputs.branch }}
        TARGET_HEAD_SHA: ${{ inputs.head-sha }}
        WORKFLOW_FILE: ${{ inputs.workflow-file }}
      run: |
        set -euo pipefail
        # Reference the workflow by file path (unique) and filter to the target branch (works for
        # main and release/v*) server-side; the API returns runs newest-first, so per_page=100
        # guarantees the most recent run is on this single page. If head-sha is set, only accept a
        # run built from that exact commit -- this pins the release to the main build of the commit
        # being released. All filtering runs inside gh's built-in --jq, which tolerates the control
        # characters GitHub sometimes embeds in commit messages. Emit id/status/conclusion as a TSV line.
        RESULT=$(gh api \
          "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/runs?branch=$TARGET_BRANCH&per_page=100" \
          --jq '[.workflow_runs[] | select(env.TARGET_HEAD_SHA == "" or .head_sha == env.TARGET_HEAD_SHA)]
                | (sort_by(.created_at) | last) as $r
                | if $r == null then empty else [$r.id, $r.status, $r.conclusion] | @tsv end')

        if [ -z "$RESULT" ]; then
          echo "No $WORKFLOW_FILE run found on branch $TARGET_BRANCH${TARGET_HEAD_SHA:+ for commit $TARGET_HEAD_SHA}. Cannot proceed with release."
          exit 1
        fi

        RUN_ID=$(printf '%s' "$RESULT" | cut -f1)
        STATUS=$(printf '%s' "$RESULT" | cut -f2)
        CONCLUSION=$(printf '%s' "$RESULT" | cut -f3)

        if [ "$STATUS" = "in_progress" ] || [ "$STATUS" = "queued" ]; then
          echo "Main build is still running (status: $STATUS). Cannot proceed with release."
          exit 1
        elif [ "$CONCLUSION" != "success" ]; then
          echo "Main build on branch $TARGET_BRANCH${TARGET_HEAD_SHA:+ (commit $TARGET_HEAD_SHA)} conclusion: $CONCLUSION"
          exit 1
        fi

        echo "Main build succeeded (run ID: $RUN_ID)."
        echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
