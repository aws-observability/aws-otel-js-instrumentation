name: CloudWatch Plugin for OpenTelemetry PR Build

# Dedicated PR build for the standalone cloudwatch-plugin-otel module. Path-scoped so it runs ONLY
# when this module changes — changes elsewhere in the repo do not trigger it, and vice versa.
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - main
      - "release/v*"
    paths:
      - "cloudwatch-plugin-otel/**"
      - ".github/workflows/cloudwatch-plugin-otel-pr-build.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: cloudwatch-plugin-otel

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "18"
      - name: Install workspace
        run: npm ci
        working-directory: .
      - name: Lint
        run: npm run lint

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "18"
      - name: Install workspace
        run: npm ci
        working-directory: .
      - name: Build and run unit tests
        run: npm test

  compat-tests:
    name: Unit + contract (OTel ${{ matrix.channel }})
    runs-on: ubuntu-latest # provides a Docker daemon for the DB/messaging Testcontainers suites
    strategy:
      fail-fast: false
      matrix:
        channel: [pinned, latest] # pinned = the versions the module declares; latest = newest release
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "18"
      - name: Install workspace
        run: npm ci
        working-directory: .
      - name: Bump to latest OTel (latest channel only)
        if: matrix.channel == 'latest'
        run: |
          npm install --no-audit --no-fund --save-dev \
            @opentelemetry/api@latest \
            @opentelemetry/sdk-node@latest \
            @opentelemetry/auto-instrumentations-node@latest \
            @opentelemetry/sdk-trace-base@latest \
            @opentelemetry/sdk-trace-node@latest \
            @opentelemetry/sdk-metrics@latest \
            @opentelemetry/resources@latest
      - name: Build (src + contract apps)
        run: |
          npx tsc -p .
          npx tsc -p tsconfig.apps.json
      - name: Unit + contract suites (all modes and families)
        run: npx ts-mocha --timeout 300000 -p tsconfig.json 'test/**/*.test.ts' 'contract-tests/**/*.test.ts'
