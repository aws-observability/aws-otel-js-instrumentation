name: Contract Tests

on:
  workflow_call:
    inputs:
      tarball-artifact-name:
        required: false
        type: string
        default: distro-tarball
        description: "Name of the uploaded distro tarball artifact to download."
      ref:
        required: false
        type: string
        default: ''
        description: "Git ref to check out. Defaults to the triggering SHA."

permissions:
  contents: read

jobs:
  select-tests:
    # Fork PRs run on GitHub-hosted runners; the CodeBuild webhook requires approval for them.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(format('["codebuild-adot-js-runner-{0}-{1}", "image:ubuntu-8.0", "instance-size:large"]', github.run_id, github.run_attempt)) }}
    outputs:
      tests: ${{ steps.filter.outputs.tests }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up CodeBuild runner
        uses: ./.github/actions/codebuild-runner-setup

      - name: Select tests
        id: filter
        run: |
          tests=$(yq -o=json '.' contract-tests/tests.yaml | jq -c '
            .test_base as $base
            | [ .tests[]
                | { name,
                    pytest_args: ([ .paths[] | $base + "/" + . ] | join(" ")) } ]')
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

  contract-test:
    needs: select-tests
    # Fork PRs run on GitHub-hosted runners; the CodeBuild webhook requires approval for them.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(format('["codebuild-adot-js-runner-{0}-{1}", "image:ubuntu-8.0", "instance-size:large"]', github.run_id, github.run_attempt)) }}
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.select-tests.outputs.tests) }}
    name: ${{ matrix.test.name }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up CodeBuild runner
        uses: ./.github/actions/codebuild-runner-setup

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c #v6.0.0
        with:
          python-version: '3.10'

      - name: Download distro tarball
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 #v5.0.0
        with:
          name: ${{ inputs.tarball-artifact-name }}
          path: dist

      - name: Pull contract-test images
        uses: ./.github/actions/retry
        env:
          CONTRACT_TEST_NAME: ${{ matrix.test.name }}
        with:
          timeout-minutes: 30
          max-attempts: 6
          retry-wait-seconds: 60
          retry-backoff-multiplier: 2
          command: |
            docker pull public.ecr.aws/docker/library/python:3.10
            docker pull public.ecr.aws/docker/library/node:20-alpine
            case "$CONTRACT_TEST_NAME" in
              aws-sdk)
                docker pull localstack/localstack:3.5.0
                ;;
              mongodb|mongoose)
                docker pull public.ecr.aws/docker/library/mongo:7.0.9
                ;;
              mysql2)
                docker pull public.ecr.aws/docker/library/mysql:8.4
                ;;
            esac

      - name: Build images and run ${{ matrix.test.name }} contract tests
        run: |
          bash scripts/set-up-contract-tests.sh ${{ matrix.test.name }}
          pytest ${{ matrix.test.pytest_args }} -v
