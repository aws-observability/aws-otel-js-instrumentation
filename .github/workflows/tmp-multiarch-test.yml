# TEMPORARY: answers PR #572 review question on whether QEMU/binfmt multi-arch builds work on CodeBuild runners.
# Mirrors the image steps of .github/actions/artifacts_build with push_image: true, but builds without pushing.
# Delete before merging.
name: TMP Multi-arch build test
on:
  pull_request:

permissions:
  contents: read

jobs:
  multiarch-build:
    runs-on:
      - codebuild-adot-js-runner-${{ github.run_id }}-${{ github.run_attempt }}
      - image:ubuntu-8.0
      - instance-size:large
    steps:
      - name: Checkout Repo @ SHA - ${{ github.sha }}
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 #v5.0.0
        with:
          node-version: 24

      - name: Install Dependencies, Compile, and Build Tarball
        run: |
          npm install
          npm run compile
          cd aws-distro-opentelemetry-node-autoinstrumentation
          npm pack

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 #3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 #v3.11.1

      - name: Show builder platforms
        run: docker buildx inspect --bootstrap | grep -i platforms

      - name: Logout of public AWS ECR
        run: docker logout public.ecr.aws

      - name: Build multi-arch image (no push)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 #v6.18.0
        with:
          push: false
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: tmp-multiarch-test
