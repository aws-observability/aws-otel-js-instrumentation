'@langchain/core':
  versions:
    include: '>=1.1.48 <2.0.0'
    mode: max-5
  peerDependencies:
    - '@langchain/anthropic@1.4.0'
    - '@langchain/aws@1.3.9'
    - '@langchain/cohere@1.0.5'
    - '@langchain/deepseek@1.0.27'
    - '@langchain/google-genai@2.1.31'
    - '@langchain/groq@1.2.1'
    - '@langchain/langgraph@1.3.4'
    - '@langchain/mistralai@1.1.0'
    - '@langchain/openai@1.4.7'
    - '@langchain/xai@1.3.19'
  commands: npm run test:instrumentation:langchain

'@openai/agents':
  - versions:
      include: '0.5.0'
    peerDependencies:
      - '@openai/agents-extensions@0.5.0'
      - 'zod@^4.0.0'
    commands: npm run test:instrumentation:openai-agents
  - versions:
      include: '0.8.4'
    peerDependencies:
      - '@openai/agents-extensions@0.8.4'
      - 'zod@^4.0.0'
    commands: npm run test:instrumentation:openai-agents
  - versions:
      include: '0.11.8'
    peerDependencies:
      - '@openai/agents-extensions@0.11.8'
      - 'zod@^4.0.0'
    commands: npm run test:instrumentation:openai-agents
  - versions:
      include: '0.16.0'
    peerDependencies:
      - '@openai/agents-extensions@0.16.0'
      - 'zod@^4.0.0'
    commands: npm run test:instrumentation:openai-agents
  - versions:
      include: '>=0.5.0'
      mode: latest-majors
    peerDependencies:
      - '@openai/agents-extensions@latest'
      - 'zod@^4.0.0'
    commands: npm run test:instrumentation:openai-agents

ai:
  - versions:
      include: '4.0.0'
    peerDependencies:
      - '@ai-sdk/amazon-bedrock@^2.0.0'
      - '@ai-sdk/anthropic@^1.0.0'
      - '@ai-sdk/cohere@^1.0.0'
      - '@ai-sdk/google@^1.0.0'
      - '@ai-sdk/groq@^1.0.0'
      - '@ai-sdk/mistral@^1.0.0'
      - '@ai-sdk/openai@^1.0.0'
      - '@ai-sdk/xai@^1.0.0'
      - 'zod@^3.25.76'
    commands: npm run test:instrumentation:vercel-ai
  - versions:
      include: '>=4.0.0 <5.0.0'
      mode: latest-majors
    peerDependencies:
      - '@ai-sdk/amazon-bedrock@^2.0.0'
      - '@ai-sdk/anthropic@^1.0.0'
      - '@ai-sdk/cohere@^1.0.0'
      - '@ai-sdk/google@^1.0.0'
      - '@ai-sdk/groq@^1.0.0'
      - '@ai-sdk/mistral@^1.0.0'
      - '@ai-sdk/openai@^1.0.0'
      - '@ai-sdk/xai@^1.0.0'
      - 'zod@^3.25.76'
    commands: npm run test:instrumentation:vercel-ai
  - versions:
      include: '>=5.0.0 <6.0.0'
      mode: latest-majors
    peerDependencies:
      - '@ai-sdk/amazon-bedrock@^3.0.0'
      - '@ai-sdk/anthropic@^2.0.0'
      - '@ai-sdk/cohere@^2.0.0'
      - '@ai-sdk/google@^2.0.0'
      - '@ai-sdk/groq@^2.0.0'
      - '@ai-sdk/mistral@^2.0.0'
      - '@ai-sdk/openai@^2.0.0'
      - '@ai-sdk/xai@^2.0.0'
      - 'zod@^4.0.0'
    commands: npm run test:instrumentation:vercel-ai
  - versions:
      include: '>=6.0.0 <7.0.0'
      mode: latest-majors
    peerDependencies:
      - '@ai-sdk/amazon-bedrock@^4.0.0'
      - '@ai-sdk/anthropic@^3.0.0'
      - '@ai-sdk/cohere@^3.0.0'
      - '@ai-sdk/google@^3.0.0'
      - '@ai-sdk/groq@^3.0.0'
      - '@ai-sdk/mistral@^3.0.0'
      - '@ai-sdk/openai@^3.0.0'
      - '@ai-sdk/xai@^3.0.0'
      - 'zod@^4.1.8'
    commands: npm run test:instrumentation:vercel-ai
