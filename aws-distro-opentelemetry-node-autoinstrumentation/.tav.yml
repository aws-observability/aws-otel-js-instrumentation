'@langchain/core':
  - versions:
      include: '>=0.3.73 <1.0.0'
      mode: max-5
    node: '>=18'
    peerDependencies:
      - 'zod@^3.25.76'
    commands: npm run test:compatibility:langchain
  - versions:
      include: '>=1.0.0 <2.0.0'
      mode: max-5
    node: '>=20'
    peerDependencies:
      - 'zod@^3.25.76'
    commands: npm run test:compatibility:langchain

'@openai/agents':
  - versions:
      include: '0.0.17'
    node: '>=18'
    peerDependencies:
      - 'zod@^3.25.40'
    commands: npm run test:compatibility:openai-agents
  - versions:
      include: '>=0.1.0 <0.4.0'
      mode: latest-minors
    node: '>=18'
    peerDependencies:
      - 'zod@^3.25.40'
    commands: npm run test:compatibility:openai-agents
  - versions:
      include: '>=0.4.0 <0.15.0'
      mode: latest-minors
    node: '>=18'
    peerDependencies:
      - 'zod@^4.0.0'
    commands: npm run test:compatibility:openai-agents
  - versions:
      include: '>=0.15.0 <1.0.0'
      mode: latest-minors
    node: '>=22'
    peerDependencies:
      - 'zod@^4.0.0'
    commands: npm run test:compatibility:openai-agents

ai:
  - versions:
      include: '3.3.11'
    node: '>=18'
    peerDependencies:
      - '@ai-sdk/openai@0.0.49'
      - 'zod@^3.22.0'
    commands: npm run test:compatibility:vercel-ai
  - versions:
      include: '3.3.44'
    node: '>=18'
    peerDependencies:
      - '@ai-sdk/openai@0.0.62'
      - 'zod@^3.22.0'
    commands: npm run test:compatibility:vercel-ai
  - versions:
      include: '3.4.33'
    node: '>=18'
    peerDependencies:
      - '@ai-sdk/openai@0.0.72'
      - 'zod@^3.22.0'
    commands: npm run test:compatibility:vercel-ai
  - versions:
      include: '4.0.0'
    # A fresh CJS install now resolves an ESM-only nanoid transitive dependency on Node 18.
    node: '>=20'
    peerDependencies:
      - '@ai-sdk/openai@1.0.0'
      - 'zod@^3.25.76'
    commands: npm run test:compatibility:vercel-ai
  - versions:
      include: '>4.0.0 <5.0.0'
      mode: max-5-latest
    node: '>=18'
    peerDependencies:
      - '@ai-sdk/openai@^1.0.0'
      - 'zod@^3.25.76'
    commands: npm run test:compatibility:vercel-ai
  - versions:
      include: '5.0.0'
    node: '>=18'
    peerDependencies:
      - '@ai-sdk/openai@2.0.0'
      - 'zod@^4.0.0'
    commands: npm run test:compatibility:vercel-ai
  - versions:
      include: '>5.0.0 <6.0.0'
      mode: max-5
    node: '>=18'
    peerDependencies:
      - '@ai-sdk/openai@^2.0.0'
      - 'zod@^4.0.0'
    commands: npm run test:compatibility:vercel-ai
  - versions:
      include: '6.0.0'
    node: '>=18'
    peerDependencies:
      - '@ai-sdk/openai@3.0.0'
      - 'zod@^4.1.8'
    commands: npm run test:compatibility:vercel-ai
  - versions:
      include: '>6.0.0 <7.0.0'
      mode: max-5
    node: '>=18'
    peerDependencies:
      - '@ai-sdk/openai@^3.0.0'
      - 'zod@^4.1.8'
    commands: npm run test:compatibility:vercel-ai
