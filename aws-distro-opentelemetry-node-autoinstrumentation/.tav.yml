'@langchain/core':
  - versions:
      include: '1.0.0'
    node: '>=20'
    preinstall: npm uninstall --no-save --no-audit --no-fund @langchain/core @langchain/anthropic @langchain/aws @langchain/cohere @langchain/deepseek @langchain/google-genai @langchain/groq @langchain/langgraph @langchain/mistralai @langchain/openai @langchain/xai zod
    peerDependencies:
      - '@langchain/anthropic@1.0.0'
      - '@langchain/aws@1.0.0'
      - '@langchain/cohere@1.0.0'
      - '@langchain/deepseek@1.0.0'
      - '@langchain/google-genai@1.0.0'
      - '@langchain/groq@1.0.0'
      - '@langchain/langgraph@1.0.0-alpha.5'
      - '@langchain/mistralai@1.0.0'
      - '@langchain/openai@1.0.0'
      - '@langchain/xai@1.0.0'
      - 'zod@^3.25.76'
    commands: npm run test:instrumentation:langchain
  - versions:
      include: '>1.0.0 <2.0.0'
      mode: latest-majors
    node: '>=20'
    preinstall: npm uninstall --no-save --no-audit --no-fund @langchain/core @langchain/anthropic @langchain/aws @langchain/cohere @langchain/deepseek @langchain/google-genai @langchain/groq @langchain/langgraph @langchain/mistralai @langchain/openai @langchain/xai zod
    peerDependencies:
      - '@langchain/anthropic@^1.3.26'
      - '@langchain/aws@^1.3.5'
      - '@langchain/cohere@^1.0.4'
      - '@langchain/deepseek@^1.0.24'
      - '@langchain/google-genai@^2.1.27'
      - '@langchain/groq@^1.2.0'
      - '@langchain/langgraph@^1.2.9'
      - '@langchain/mistralai@^1.0.7'
      - '@langchain/openai@^1.4.4'
      - '@langchain/xai@^1.3.16'
      - 'zod@^3.25.76'
    commands: npm run test:instrumentation:langchain

