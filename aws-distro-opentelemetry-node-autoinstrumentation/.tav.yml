'@langchain/core':
  - versions:
      include: '1.0.0'
    node: '>=20'
    peerDependencies:
      - 'zod@^3.25.76'
    commands: node scripts/run-test-all-versions.js verify @langchain/core
  - versions:
      include: '>1.0.0 <2.0.0'
      mode: latest-majors
    node: '>=20'
    peerDependencies:
      - 'zod@^3.25.76'
    commands: node scripts/run-test-all-versions.js verify @langchain/core

'@openai/agents':
  - versions:
      include: '>0.1.0 <1.0.0'
      mode: latest-majors
    node: '>=22'
    peerDependencies:
      - 'zod@^4.0.0'
    commands: node scripts/run-test-all-versions.js verify @openai/agents
  - versions:
      include: '0.1.0'
    node: '>=18'
    peerDependencies:
      - 'zod@^3.25.40'
    commands: node scripts/run-test-all-versions.js verify @openai/agents

ai:
  - versions:
      include: '>=3.3.0 <4.0.0'
      mode: latest-majors
    node: '>=18'
    peerDependencies:
      - '@ai-sdk/openai@0.0.72'
      - 'zod@^3.22.0'
    commands: node scripts/run-test-all-versions.js verify ai
  - versions:
      include: '>=4.0.0 <5.0.0'
      mode: latest-majors
    node: '>=18'
    peerDependencies:
      - '@ai-sdk/openai@^1.0.0'
      - 'zod@^3.25.76'
    commands: node scripts/run-test-all-versions.js verify ai
  - versions:
      include: '>=5.0.0 <6.0.0'
      mode: latest-majors
    node: '>=18'
    peerDependencies:
      - '@ai-sdk/openai@^2.0.0'
      - 'zod@^4.0.0'
    commands: node scripts/run-test-all-versions.js verify ai
  - versions:
      include: '>=6.0.0 <7.0.0'
      mode: latest-majors
    node: '>=18'
    peerDependencies:
      - '@ai-sdk/openai@^3.0.0'
      - 'zod@^4.1.8'
    commands: node scripts/run-test-all-versions.js verify ai
